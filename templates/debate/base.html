<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}PDA Debate Practice{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='debate/css/style.css') }}">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            gov: { DEFAULT: '#4f46e5', light: '#eef2ff', dark: '#3730a3' },
            opp: { DEFAULT: '#e11d48', light: '#fff1f2', dark: '#9f1239' },
            brand: { DEFAULT: '#4338ca', dark: '#312e81', light: '#818cf8' }
          }
        }
      }
    }
  </script>
  {% block head %}{% endblock %}
</head>
<body class="relative min-h-screen text-slate-800 antialiased">
  <div class="pointer-events-none fixed inset-0 -z-10 overflow-hidden" aria-hidden="true">
    <div class="absolute inset-0 bg-gradient-to-br from-indigo-50 via-white to-rose-50"></div>
    <div class="absolute -top-24 -left-24 w-96 h-96 rounded-full bg-indigo-200/40 blur-3xl"></div>
    <div class="absolute -bottom-24 -right-24 w-96 h-96 rounded-full bg-rose-200/40 blur-3xl"></div>
  </div>

  <header class="glass-header sticky top-0 z-40">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="{{ url_for('debate.index') }}" class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-brand flex items-center justify-center text-white text-lg font-bold shadow">D</div>
        <div>
          <h1 class="text-lg font-bold text-brand-dark leading-tight">PDA Debate Practice</h1>
          <p class="text-xs text-slate-500">即興ディベート練習（PM / LO / MG / MO / LOR / PMR）</p>
        </div>
      </a>
      {% block header_actions %}{% endblock %}
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-6 pb-16">
    {% block body %}{% endblock %}
  </main>

  {% block scripts %}{% endblock %}
</body>
</html>
