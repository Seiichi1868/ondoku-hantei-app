<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Vibe Speak Conjugate{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('conjugate.static', filename='css/style.css', v='20260815c') }}">
  {% block head %}{% endblock %}
</head>
<body class="relative min-h-screen text-slate-800 antialiased vsc-body {% block body_class %}{% endblock %}">
  <div class="pointer-events-none fixed inset-0 -z-10 overflow-hidden" aria-hidden="true">
    <div id="page-bg-layer" class="vsc-bg-image absolute inset-0 scale-105"
      style="background-image: url('{{ appearance.background_image_url }}'); opacity: {{ appearance.background_opacity }};"></div>
    <div id="page-bg-wash" class="absolute inset-0"
      style="opacity: {{ 1 - appearance.background_opacity }};">
      <div class="absolute inset-0 bg-gradient-to-br from-sky-100 via-white to-emerald-100"></div>
      <div class="absolute inset-0 bg-gradient-to-t from-emerald-50/80 via-transparent to-sky-50/60"></div>
    </div>
  </div>

  <header class="vsc-glass-header sticky top-0 z-40">
    <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="{{ url_for('conjugate.index') }}" class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-sky-600 to-emerald-600 flex items-center justify-center text-white text-lg font-bold shadow">活</div>
        <div>
          <h1 class="text-base font-bold tracking-tight bg-gradient-to-r from-sky-700 via-teal-700 to-emerald-700 bg-clip-text text-transparent leading-tight">Vibe Speak Conjugate</h1>
          <p class="text-xs text-teal-700/70">活用瞬発トレーナー</p>
        </div>
      </a>
      <div class="flex items-center gap-2">
        {% block header_actions %}{% endblock %}
      </div>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 py-6 pb-16 {% block main_class %}{% endblock %}">
    {% block body %}{% endblock %}
  </main>

  {% block scripts %}{% endblock %}
</body>
</html>
